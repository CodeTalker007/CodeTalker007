<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-label="GitHub stats, languages, and streak">
  <defs>
    <linearGradient id="panelAccent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
  </defs>

  <rect width="840" height="420" rx="16" fill="#1a1b26"/>
  <rect x="0.5" y="0.5" width="839" height="419" rx="16" fill="none" stroke="#3b4261"/>
  <rect x="16" y="12" width="808" height="4" rx="2" fill="#7aa2f7"/>

  <text x="28" y="44" fill="#c0caf5" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700">GitHub</text>

  <line x1="28" y1="56" x2="812" y2="56" stroke="#3b4261"/>
  <line x1="420" y1="68" x2="420" y2="236" stroke="#3b4261"/>

  <text x="28" y="82" fill="#7aa2f7" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700">Stats</text>
  <g font-family="Segoe UI, Ubuntu, sans-serif">
    <circle cx="36" cy="110" r="3.5" fill="#7aa2f7"/>
    <text x="50" y="115" fill="#a9b1d6" font-size="13">Total commits</text>
    <text x="400" y="115" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="700">1.8k</text>

    <circle cx="36" cy="142" r="3.5" fill="#bb9af7"/>
    <text x="50" y="147" fill="#a9b1d6" font-size="13">Pull requests</text>
    <text x="400" y="147" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="700">2</text>

    <circle cx="36" cy="174" r="3.5" fill="#9ece6a"/>
    <text x="50" y="179" fill="#a9b1d6" font-size="13">Contributed to</text>
    <text x="400" y="179" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="700">5</text>

    <circle cx="36" cy="206" r="3.5" fill="#7dcfff"/>
    <text x="50" y="211" fill="#a9b1d6" font-size="13">Member since</text>
    <text x="400" y="211" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="700">2018</text>
  </g>

  <text x="444" y="82" fill="#7aa2f7" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700">Top Languages</text>
  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="13">
    <text x="444" y="106" fill="#c0caf5">PHP</text>
    <rect x="444" y="112" width="368" height="7" rx="3.5" fill="#292e42"/>
    <rect x="444" y="112" width="210" height="7" rx="3.5" fill="#4F5D95"/>

    <text x="444" y="136" fill="#c0caf5">JavaScript</text>
    <rect x="444" y="142" width="368" height="7" rx="3.5" fill="#292e42"/>
    <rect x="444" y="142" width="88" height="7" rx="3.5" fill="#f1e05a"/>

    <text x="444" y="166" fill="#c0caf5">Blade</text>
    <rect x="444" y="172" width="368" height="7" rx="3.5" fill="#292e42"/>
    <rect x="444" y="172" width="62" height="7" rx="3.5" fill="#f7523f"/>

    <text x="444" y="196" fill="#c0caf5">HTML</text>
    <rect x="444" y="202" width="368" height="7" rx="3.5" fill="#292e42"/>
    <rect x="444" y="202" width="40" height="7" rx="3.5" fill="#e34c26"/>

    <text x="444" y="226" fill="#c0caf5">TypeScript</text>
    <rect x="444" y="232" width="368" height="7" rx="3.5" fill="#292e42"/>
    <rect x="444" y="232" width="28" height="7" rx="3.5" fill="#3178c6"/>
  </g>

  <line x1="28" y1="250" x2="812" y2="250" stroke="#3b4261"/>
  <text x="28" y="274" fill="#7aa2f7" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700">Streak</text>
  <line x1="300" y1="286" x2="300" y2="396" stroke="#3b4261"/>
  <line x1="540" y1="286" x2="540" y2="396" stroke="#3b4261"/>

  <text x="164" y="330" text-anchor="middle" fill="#c0caf5" font-family="Segoe UI, Ubuntu, sans-serif" font-weight="700" font-size="32">2,543</text>
  <text x="164" y="356" text-anchor="middle" fill="#7aa2f7" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">Total Contributions</text>
  <text x="164" y="378" text-anchor="middle" fill="#565f89" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11">Jun 7, 2018 - Present</text>

  <circle cx="420" cy="322" r="32" fill="none" stroke="#bb9af7" stroke-width="5"/>
  <text x="420" y="332" text-anchor="middle" fill="#c0caf5" font-family="Segoe UI, Ubuntu, sans-serif" font-weight="700" font-size="28">1</text>
  <text x="420" y="372" text-anchor="middle" fill="#bb9af7" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">Current Streak</text>
  <text x="420" y="392" text-anchor="middle" fill="#565f89" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11">Aug 25</text>

  <text x="676" y="330" text-anchor="middle" fill="#c0caf5" font-family="Segoe UI, Ubuntu, sans-serif" font-weight="700" font-size="32">13</text>
  <text x="676" y="356" text-anchor="middle" fill="#9ece6a" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">Longest Streak</text>
  <text x="676" y="378" text-anchor="middle" fill="#565f89" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11">Jan 21 - Feb 1, 2025</text>
</svg>
